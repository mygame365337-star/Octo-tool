name: Octo Cloud Brain

on:
  workflow_dispatch:
    inputs:
      link:
        description: 'Đường link Octo cần vượt'
        required: true
        type: string

jobs:
  run-bypass:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      - name: Run Bypass Engine
        env:
          TARGET_URL: ${{ github.event.inputs.link }}
        run: python3 main.py
