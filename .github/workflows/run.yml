name: Captcha Stop Octolink

on:
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Cai dat Thu vien va Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium --with-deps
          touch ket_qua.txt
      
      - name: Tao domains.txt mac dinh
        run: |
          if [ ! -f domains.txt ]; then
            printf "c168.cm\noctohide.com\n" > domains.txt
          fi
      
      - name: Chay script Octo.py
        env:
          OCTO_URL: ${{ secrets.OCTO_URL }}
        run: python -u Octo.py
      
      - name: Hien thi ket qua terminal
        if: always()
        run: cat ket_qua.txt || echo "Khong tim thay ket_qua.txt"

      - name: Luu ket qua Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ket-qua-octolink
          path: ket_qua.txt
          if-no-files-found: ignore
