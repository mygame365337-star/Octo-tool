name: Chay tool Octolink

on:
  workflow_dispatch:

jobs:
  run-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache invisible-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/invisible_playwright
          key: invisible-playwright-v1
      
      - name: Cai Python + invisible-playwright + proxy-relay
        run: |
          pip install invisible-playwright proxy-relay
          python -m invisible_playwright fetch
      
      - name: Chay tool
        env:
          OCTO_URL: ${{ secrets.OCTO_URL }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
        run: python Octo.py
      
      - name: Luu ket qua
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ket-qua
          path: ket_qua.txt
          if-no-files-found: warn
