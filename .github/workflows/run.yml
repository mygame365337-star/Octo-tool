name: Run Octo Bypass

on:
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Tự động cache thư viện cho những lần chạy sau

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi requests

      - name: Run bypass script
        env:
          OCTO_URL: ${{ secrets.OCTO_URL }} # Lấy link từ phần Secrets bảo mật
        run: |
          python octo.py

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: ket-qua-bypass
          path: ket_qua.txt
