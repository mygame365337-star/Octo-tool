name: API Octolink

on:
  workflow_dispatch:

jobs:
  run-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Cai dat Thu vien
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi requests
          touch ket_qua.txt
      
      - name: Chay script API
        env:
          OCTO_URL: ${{ secrets.OCTO_URL }}
        run: python -u Octo.py
      
      - name: Hien thi ket qua
        if: always()
        run: |
          cat ket_qua.txt || echo "Khong tim thay ket qua"

      - name: Luu ket qua Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ket-qua-octolink
          path: ket_qua.txt
