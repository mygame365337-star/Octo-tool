name: Chay tool Octolink

on:
  workflow_dispatch:

jobs:
  run-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Cai dat Thu vien va Trinh duyet
        run: |
          python -m pip install --upgrade pip
          pip install rich curl_cffi playwright proxy-relay opencv-python-headless pillow numpy
          playwright install chromium --with-deps
          sudo apt-get update && sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2
      
      - name: Cau hinh moi truong va File
        env:
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
        run: |
          if [ ! -f domains.txt ]; then
            printf "octohide.com\nlinksv.net\n" > domains.txt
          fi
          
          if [ -n "$PROXY_SERVER" ]; then
            if [[ "$PROXY_SERVER" =~ ^https?:// ]] || [[ "$PROXY_SERVER" =~ ^socks ]]; then
              echo "$PROXY_SERVER" > proxy.txt
            elif [ -n "$PROXY_USER" ] && [ -n "$PROXY_PASS" ]; then
              echo "http://$PROXY_USER:$PROXY_PASS@$PROXY_SERVER" > proxy.txt
            else
              echo "http://$PROXY_SERVER" > proxy.txt
            fi
          fi
          
          touch ket_qua.txt
      
      - name: Chay script Octo.py
        env:
          OCTO_URL: ${{ secrets.OCTO_URL }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
        run: python -u Octo.py
      
      - name: Hien thi ket qua terminal
        if: always()
        run: |
          echo "=== NOI DUNG KET_QUA.TXT ==="
          cat ket_qua.txt || echo "Khong tim thay file ket_qua.txt"

      - name: Luu ket qua Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ket-qua-octolink
          path: |
            ket_qua.txt
            *.png
          if-no-files-found: ignore
