name: Chay tool Octolink

on:
  workflow_dispatch:

jobs:
  run-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cai Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium
      - name: Chay tool
        env:
          OCTO_URL: ${{ secrets.OCTO_URL }}
        run: python Octo.py
      - name: Luu ket qua
        uses: actions/upload-artifact@v4
        with:
          name: ket-qua
          path: ket_qua.txt
