name: Playwright Octolink

on:
  workflow_dispatch:

jobs:
  run-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Cai dat Thu vien va Playwright
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi playwright requests
          playwright install chromium --with-deps
          touch ket_qua.txt
      
      - name: Tao domains.txt mac dinh neu chua co
        run: |
          if [ ! -f domains.txt ]; then
            echo "c168.cm" > domains.txt
          fi
      
      - name: Chay script Python
        env:
          OCTO_URL: ${{ secrets.OCTO_URL }}
        run: python -u Octo.py
      
      - name: Hien thi ket qua
        if: always()
        run: cat ket_qua.txt
      
      - name: Luu ket qua Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ket-qua-octolink
          path: ket_qua.txt
